evaluator:
  auto_discover: true
  max_sources: 80
  min_weekly_output: 2
  stale_weeks: 4
  protect_types: [github]  # Never auto-archive these (rate-limited ≠ stale)
fetch:
  concurrency: 10
  max_articles_per_source: 20
  timeout: 30
  user_agent: Weekly-AI-Report-Agent/1.0
filter:
  blacklist_keywords:
    # 商业金融
    - 涨停
    - 跌停
    - 股价
    - 融资
    - 估值
    - valuation
    - IPO
    - 上市
    - 投资者
    - investor
    - funding round
    - raises .* million
    - raises .* billion

    # 噪音领域
    - NFT
    - web3
    - 元宇宙
    - 链游
    - 数字藏品
    - 虚拟货币
    - 加密货币
    - 挖矿

    # 标题党/空洞
    - 套壳
    - 炒作
    - 手把手教你
    - 震惊
    - 突发
    - 重磅
  categories:
  - keywords:
    - 大模型
    - LLM
    - GPT
    - Claude
    - Gemini
    - 预训练
    - 后训练
    - RLHF
    - 对齐
    - 微调
    - 推理
    - Transformer
    - MoE
    - 多模态
    - 长上下文
    name: LLM
  - keywords:
    - AI Agent
    - 智能体
    - 工具调用
    - 多Agent
    - Multi-Agent
    - 自主决策
    - 规划
    - 反思
    - ReAct
    - 自我改进
    name: Agent
  - keywords:
    - AlphaFold
    - 蛋白质
    - 分子
    - 药物
    - 材料
    - 科学计算
    - AI4Science
    name: AI for Science
  - keywords:
    - CAD
    - CAE
    - CFD
    - 仿真
    - 渲染
    - 生成式设计
    - 3D
    - Omniverse
    name: 设计仿真
  - keywords:
    - 数字孪生
    - Digital Twin
    - IoT
    - 工业4.0
    - 实时仿真
    - 预测性维护
    name: 数字孪生
model:
  api_key: dummy
  base_url: http://8.130.169.133:8088/v1
  max_retries: 5
  max_tokens: 8192
  name: Qwen3.6-27B
  provider: custom
  temperature: 0.3
  timeout: 600
output:
  dir: output
  template: generator/templates/weekly.html
