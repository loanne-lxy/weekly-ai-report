evaluator:
  auto_discover: true
  max_sources: 80
  min_weekly_output: 2
  stale_weeks: 4
  protect_types: [github]  # Never auto-archive these (rate-limited ≠ stale)
fetch:
  concurrency: 10
  max_articles_per_source: 20
  timeout: 30
  user_agent: Weekly-AI-Report-Agent/1.0
filter:
  categories:
  - keywords:
    - 大模型
    - LLM
    - GPT
    - Claude
    - Gemini
    - 预训练
    - RLHF
    - 对齐
    - Transformer
    - 推理
    name: LLM
  - keywords:
    - AI Agent
    - 智能体
    - 工具调用
    - RAG
    - 多Agent
    - 自主
    - 规划
    name: Agent
  - keywords:
    - AlphaFold
    - 蛋白质
    - 分子
    - 药物
    - 材料
    - 科学计算
    - AI4Science
    name: AI for Science
  - keywords:
    - CAD
    - CAE
    - CFD
    - 仿真
    - 渲染
    - 生成式设计
    - 3D
    - Omniverse
    name: 设计仿真
  - keywords:
    - 数字孪生
    - Digital Twin
    - IoT
    - 工业4.0
    - 实时仿真
    - 预测性维护
    name: 数字孪生
  pre_filter_keywords:
  - AI
  - 人工智能
  - LLM
  - Agent
  - 模型
  - 训练
  - simulation
  - digital twin
  - 仿真
  - 数字孪生
  - generative design
  - 生成式设计
  - CAD
  - CFD
  - IoT
  - 3D
  - rendering
model:
  api_key: dummy
  base_url: http://8.130.169.133:8088/v1
  max_retries: 5
  max_tokens: 8192
  name: Qwen3.6-27B
  provider: custom
  temperature: 0.3
  timeout: 600
output:
  dir: output
  template: generator/templates/weekly.html
