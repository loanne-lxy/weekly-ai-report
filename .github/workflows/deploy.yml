name: Deploy Weekly Report to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy output/ to deploy directory
        run: |
          mkdir -p deploy
          if [ -d output ]; then
            cp -r output/* deploy/
            echo "Copied output/ to deploy/ (all weeks)"
          else
            echo "No output/ directory found"
          fi

      - name: Create root index.html (redirect to latest week)
        run: |
          LATEST_WEEK=$(ls -d deploy/*/index.html 2>/dev/null | sort -r | head -1 | grep -oP '\d{4}-W\d{2}')

          cat > deploy/index.html << HTML
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <meta http-equiv="refresh" content="0;url=/weekly-ai-report/${LATEST_WEEK}/">
          <title>Weekly AI Report</title>
          <style>
            body { font-family: sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
            .box { text-align: center; }
            h1 { color: #2563eb; }
            p { color: #64748b; }
            a { color: #2563eb; }
          </style>
          </head>
          <body>
          <div class="box">
            <h1>📊 Weekly AI Report</h1>
            <p>正在跳转到最新一期周报...</p>
            <p><a href="/${LATEST_WEEK}/">如果未跳转，点击这里</a></p>
            <p style="margin-top:2rem;font-size:0.85rem">历史周报: ${LATEST_WEEK}</p>
          </div>
          </body>
          </html>
          HTML
          echo "Root index created, redirecting to: /${LATEST_WEEK}/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: false
