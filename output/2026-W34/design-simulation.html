<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计仿真 — AI 前沿资讯周报</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #141414; background: #f5f7fa; line-height: 1.5715; font-size: 14px;
  min-height: 100vh;
}
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

/* ── Back Nav ── */
.back-nav {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: #1677ff; margin-bottom: 24px;
  text-decoration: none; cursor: pointer;
}
.back-nav:hover { text-decoration: underline; }

/* ── Category Header ── */
.cat-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
  padding: 24px; background: #fff; border-radius: 8px;
  border-left: 4px solid #f59e0b;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.cat-header .icon { font-size: 36px; }
.cat-header h1 { font-size: 24px; font-weight: 700; color: #1a5276; flex: 1; }
.cat-header .count-badge {
  background: #f59e0b15; color: #f59e0b;
  font-size: 14px; padding: 4px 16px; border-radius: 16px; font-weight: 500;
}

/* ── Domain Summary ── */
.domain-summary {
  background: #f0f5ff; border-radius: 8px; padding: 16px 20px;
  margin-bottom: 24px; border-left: 4px solid #1677ff;
  font-size: 14px; color: #434343; line-height: 1.6;
}
.domain-summary strong { color: #1a5276; }

/* ── Event Card ── */
.event-card {
  background: #fff; border-radius: 8px; border: 1px solid #e8e8e8;
  padding: 24px; margin-bottom: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.event-card:hover { border-color: #1677ff; box-shadow: 0 4px 12px rgba(22,119,255,0.1); }
.event-card.carried { opacity: 0.65; }
.event-card.carried:hover { border-color: #d9d9d9; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }

/* ── Score Badges Row ── */
.score-badges {
  display: flex; gap: 16px; margin-bottom: 12px;
}
.score-badge-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; color: #595959;
}
.score-badge-item .badge {
  display: inline-block; padding: 0 8px; line-height: 20px;
  border-radius: 10px; font-size: 12px; font-weight: 600; color: #fff;
}
.badge-importance { background: linear-gradient(135deg, #1677ff, #4096ff); }
.badge-novelty { background: linear-gradient(135deg, #722ed1, #9254de); }
.badge-impact { background: linear-gradient(135deg, #fa8c16, #ffa940); }

/* ── Event Title ── */
.event-title {
  font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px;
  line-height: 1.4;
}
.event-title a { color: inherit; text-decoration: none; }
.event-title a:hover { color: #1677ff; }
.carried-badge {
  font-size: 12px; background: #f5f5f5; color: #8c8c8c;
  padding: 0 8px; line-height: 20px; border-radius: 4px; margin-left: 8px;
}

/* ── Event Summary ── */
.event-summary {
  font-size: 14px; color: #595959; line-height: 1.6; margin-bottom: 12px;
}

/* ── Sources Info ── */
.sources-info {
  display: flex; align-items: center; gap: 12px;
  font-size: 12px; color: #8c8c8c; margin-bottom: 12px;
  padding-bottom: 12px; border-bottom: 1px solid #f0f0f0;
}
.source-tag {
  display: inline-block; padding: 0 8px; line-height: 20px;
  background: #f0f5ff; border: 1px solid #d6eaf8; border-radius: 4px;
  font-size: 12px; color: #1a5276;
}

/* ── Key Insights ── */
.key-insights {
  margin-bottom: 12px; padding-left: 20px;
}
.key-insights li {
  font-size: 13px; color: #434343; margin-bottom: 4px; line-height: 1.5;
}

/* ── Tags ── */
.event-tags {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.tag {
  font-size: 12px; padding: 0 8px; line-height: 22px;
  background: #fafafa; border: 1px solid #d9d9d9; border-radius: 4px;
  color: #595959;
}

/* ── Linked Articles (expandable) ── */
.articles-expand {
  margin-top: 12px;
}
.articles-expand summary {
  font-size: 13px; color: #1677ff; cursor: pointer; padding: 8px 0;
  user-select: none;
}
.articles-expand summary:hover { text-decoration: underline; }
.articles-expand .article-list {
  padding: 8px 0 8px 20px; border-left: 2px solid #e8e8e8;
}
.article-list .article-item {
  padding: 6px 0; font-size: 13px; color: #595959;
  border-bottom: 1px solid #f5f5f5;
}
.article-list .article-item:last-child { border-bottom: none; }
.article-list .article-item a {
  color: #1a1a1a; text-decoration: none;
}
.article-list .article-item a:hover { color: #1677ff; }
.article-list .article-item .article-source {
  font-size: 12px; color: #8c8c8c; margin-left: 8px;
}

/* ── Empty State ── */
.empty-state {
  text-align: center; padding: 48px 24px;
  border: 1px dashed #d9d9d9; border-radius: 8px;
  background: #fff;
}
.empty-state .icon { font-size: 48px; color: #d9d9d9; margin-bottom: 12px; }
.empty-state h3 { font-size: 16px; color: #8c8c8c; margin-bottom: 8px; }
.empty-state p { font-size: 13px; color: #bfbfbf; }

/* ── Footer ── */
.footer {
  text-align: center; padding: 32px 0; color: #bfbfbf; font-size: 12px;
  border-top: 1px solid #e8e8e8; margin-top: 32px;
}

@media (max-width: 768px) {
  .container { padding: 16px; }
  .cat-header { padding: 16px; flex-wrap: wrap; }
  .cat-header h1 { font-size: 20px; }
  .event-card { padding: 16px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- Back Nav -->
  <a class="back-nav" href="index.html" aria-label="返回首页">
    <span class="arrow">←</span> 返回首页
  </a>

  <!-- Category Header -->
  <div class="cat-header">
    <span class="icon">🎨</span>
    <h1>设计仿真</h1>
    <span class="count-badge">0 个事件</span>
  </div>

  <!-- Domain Summary -->
  

  <!-- Events Container -->
  
  <div class="empty-state">
    <div class="icon">📭</div>
    <h3>暂无本周新内容</h3>
    <p>本周 设计仿真 领域暂无新事件，将回填往期精选。</p>
  </div>
  

  <div class="footer">生成于 2026-08-20 00:12 · Weekly AI Report Agent</div>

</div>
</body>
</html>
