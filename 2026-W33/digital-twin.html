<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字孪生 — AI 前沿资讯周报</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: #141414; background: #f5f7fa; line-height: 1.5715; font-size: 14px;
  min-height: 100vh;
}
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

/* ── Back Nav ── */
.back-nav {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: #1677ff; margin-bottom: 24px;
  text-decoration: none; cursor: pointer;
}
.back-nav:hover { text-decoration: underline; }
.back-nav .arrow { font-size: 16px; }

/* ── Category Header ── */
.cat-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
  padding: 24px; background: #fff; border-radius: 8px;
  border-left: 4px solid #ef4444;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.cat-header .icon { font-size: 36px; }
.cat-header h1 { font-size: 24px; font-weight: 700; color: #1a5276; flex: 1; }
.cat-header .count-badge {
  background: #ef444415; color: #ef4444;
  font-size: 14px; padding: 4px 16px; border-radius: 16px; font-weight: 500;
}

/* ── Domain Summary ── */
.domain-summary {
  background: #f0f5ff; border-radius: 8px; padding: 16px 20px;
  margin-bottom: 24px; border-left: 4px solid #1677ff;
  font-size: 14px; color: #434343; line-height: 1.6;
}
.domain-summary strong { color: #1a5276; }

/* ── Article Card ── */
.article-card {
  background: #fff; border-radius: 8px; border: 1px solid #e8e8e8;
  padding: 24px; margin-bottom: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.article-card:hover { border-color: #1677ff; box-shadow: 0 4px 12px rgba(22,119,255,0.1); }

.article-card.carried { opacity: 0.65; }
.article-card.carried:hover { border-color: #d9d9d9; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }

.article-header {
  display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px;
}
.score-badge {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: #fff;
}
.score-high { background: linear-gradient(135deg, #ff4d4f, #ff7875); }
.score-mid { background: linear-gradient(135deg, #fa8c16, #ffa940); }
.score-low { background: linear-gradient(135deg, #8c8c8c, #bfbfbf); }

.article-title-area { flex: 1; }
.article-title {
  font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px;
  line-height: 1.4;
}
.article-title a { color: inherit; text-decoration: none; }
.article-title a:hover { color: #1677ff; }
.article-subtitle {
  font-size: 13px; color: #8c8c8c; font-style: italic; line-height: 1.4;
}
.carried-badge {
  font-size: 12px; background: #f5f5f5; color: #8c8c8c;
  padding: 0 8px; height: 22px; line-height: 22px; border-radius: 4px;
  flex-shrink: 0;
}

.article-meta {
  display: flex; align-items: center; gap: 16px;
  font-size: 12px; color: #8c8c8c; margin-bottom: 16px;
  padding-bottom: 12px; border-bottom: 1px solid #f0f0f0;
}
.article-meta .source { font-weight: 500; color: #595959; }

.article-summary {
  font-size: 14px; color: #595959; line-height: 1.6; margin-bottom: 12px;
}

.key-insights {
  margin-bottom: 12px; padding-left: 20px;
}
.key-insights li {
  font-size: 13px; color: #434343; margin-bottom: 4px; line-height: 1.5;
}

.why-matters {
  font-size: 13px; color: #1677ff; font-style: italic;
  padding: 8px 12px; background: #f0f5ff; border-radius: 4px;
  margin-bottom: 12px; line-height: 1.5;
}

.article-tags {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.tag {
  font-size: 12px; padding: 0 8px; line-height: 22px;
  background: #fafafa; border: 1px solid #d9d9d9; border-radius: 4px;
  color: #595959;
}

/* ── Pagination ── */
.pagination {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 32px 0;
}
.page-btn {
  width: 32px; height: 32px; border-radius: 6px; border: 1px solid #e8e8e8;
  background: #fff; color: #595959; font-size: 13px; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s;
}
.page-btn:hover { border-color: #1677ff; color: #1677ff; }
.page-btn.active {
  background: #1677ff; color: #fff; border-color: #1677ff;
}
.page-btn.disabled {
  background: #f5f5f5; color: #d9d9d9; cursor: not-allowed;
}
.page-btn.disabled:hover { border-color: #e8e8e8; color: #d9d9d9; }
.page-ellipsis { color: #bfbfbf; font-size: 13px; padding: 0 4px; }

/* ── Empty State ── */
.empty-state {
  text-align: center; padding: 48px 24px;
  border: 1px dashed #d9d9d9; border-radius: 8px;
  background: #fff;
}
.empty-state .icon { font-size: 48px; color: #d9d9d9; margin-bottom: 12px; }
.empty-state h3 { font-size: 16px; color: #8c8c8c; margin-bottom: 8px; }
.empty-state p { font-size: 13px; color: #bfbfbf; }

/* ── Footer ── */
.footer {
  text-align: center; padding: 32px 0; color: #bfbfbf; font-size: 12px;
  border-top: 1px solid #e8e8e8; margin-top: 32px;
}

@media (max-width: 768px) {
  .container { padding: 16px; }
  .cat-header { padding: 16px; flex-wrap: wrap; }
  .cat-header h1 { font-size: 20px; }
  .article-card { padding: 16px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- Back Nav -->
  <a class="back-nav" href="index.html" aria-label="返回首页">
    <span class="arrow">←</span> 返回首页
  </a>

  <!-- Category Header -->
  <div class="cat-header">
    <span class="icon">🏭</span>
    <h1>数字孪生</h1>
    <span class="count-badge">0 篇</span>
  </div>

  <!-- Domain Summary -->
  

  <!-- Articles Container -->
  
  <div class="empty-state">
    <div class="icon">📭</div>
    <h3>暂无本周新内容</h3>
    <p>本周 数字孪生 领域暂无新资讯，将回填往期精选文章。</p>
  </div>
  

  <div class="footer">生成于 2026-08-12 17:06 · Weekly AI Report Agent</div>

</div>
</body>
</html>
