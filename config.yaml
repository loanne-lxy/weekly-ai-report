# Weekly AI Report Agent
# ========================
# 自动抓取前沿 AI 资讯（LLM/Agent/AI4Science/设计仿真/数字孪生），
# 生成周报网页。本地运行，模型可替换。

# ============================================
# 模型配置 —— 修改这里切换模型
# ============================================
model:
  # 可选 provider: ollama / openai / deepseek / custom
  provider: custom
  name: Qwen3.6-27B

  # 当前配置 —— TCL 内部模型
  base_url: http://47.86.216.146:8848/v1
  api_key:  # 留空或填入真实 key
  temperature: 0.3
  max_tokens: 2048

  # 本地 Ollama 示例:
  # provider: ollama
  # name: qwen3:14b
  # base_url: http://localhost:11434/v1
  # api_key: ollama

  # DeepSeek 示例:
  # provider: deepseek
  # name: deepseek-chat
  # base_url: https://api.deepseek.com
  # api_key: ${DEEPSEEK_API_KEY}

  # OpenAI 示例:
  # provider: openai
  # name: gpt-4o
  # base_url: https://api.openai.com/v1
  # api_key: ${OPENAI_API_KEY}

# ============================================
# 抓取配置
# ============================================
fetch:
  concurrency: 10           # 并发抓取数
  timeout: 30              # 单个源超时（秒）
  user_agent: "Weekly-AI-Report-Agent/1.0"
  max_articles_per_source: 20

# ============================================
# 筛选配置
# ============================================
filter:
  # 五大领域的提示词（传给 LLM 做分类）
  categories:
    - name: LLM
      keywords: [大模型, LLM, GPT, Claude, Gemini, 预训练, RLHF, 对齐, Transformer, 推理]
    - name: Agent
      keywords: [AI Agent, 智能体, 工具调用, RAG, 多Agent, 自主, 规划]
    - name: AI for Science
      keywords: [AlphaFold, 蛋白质, 分子, 药物, 材料, 科学计算, AI4Science]
    - name: 设计仿真
      keywords: [CAD, CAE, CFD, 仿真, 渲染, 生成式设计, 3D, Omniverse]
    - name: 数字孪生
      keywords: [数字孪生, Digital Twin, IoT, 工业4.0, 实时仿真, 预测性维护]

  # 关键词预过滤（快速筛掉完全不相关的内容）
  pre_filter_keywords: [AI, 人工智能, LLM, Agent, 模型, 训练, simulation, digital twin, 仿真, 数字孪生, generative design, 生成式设计, CAD, CFD, IoT, 3D, rendering]

# ============================================
# 源池自评估配置
# ============================================
evaluator:
  min_weekly_output: 2       # 每周最少产出数，低于此数降权
  stale_weeks: 3             # 连续无产出周数 → 归档
  max_sources: 80            # 源池上限
  auto_discover: true        # 是否自动发现新源

# ============================================
# 输出配置
# ============================================
output:
  dir: output
  template: generator/templates/weekly.html
